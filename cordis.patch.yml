# dsh-plugin-scheduled-health — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "schealth".
# Tools resultantes: mcp__schealth__* (ver README).
- insert:
    - id: mcp-scheduled-health
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: schealth
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/scheduled-health/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
